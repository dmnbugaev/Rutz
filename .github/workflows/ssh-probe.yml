# Временный verify-workflow: проверяет результат деплоя на сервере.
# Удаляется после проверки.
name: Deploy verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверка деплоя
        env:
          HOST: ${{ secrets.SSH_HOST }}
          K: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh -p 22222 -i ~/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              "admin@$HOST" '
                echo "=== VERIFY ==="
                cd /var/www/Rutz && git log --oneline -1
                timeout 10 pm2 ls 2>/dev/null | grep -E "rutz"
                echo "--- public ip ---"; (curl -s --max-time 8 ifconfig.me || curl -s --max-time 8 api.ipify.org || ip route get 1.1.1.1 2>/dev/null | head -1); echo
                echo "--- app port ---"; pm2 describe rutz 2>/dev/null | grep -E "script|exec cwd|port" | head -4
                ss -tlnp 2>/dev/null | grep next-server | head -4
                echo "--- nginx vhosts ---"; ls /etc/nginx/sites-enabled/ 2>/dev/null; grep -rE "server_name" /etc/nginx/sites-enabled/ 2>/dev/null | head -8
                echo "--- certs ---"; ls /etc/letsencrypt/live 2>/dev/null || echo no-certbot
                echo "--- http checks ---"
                curl -s -o /dev/null -w "local3000: %{http_code}\n" --max-time 8 http://127.0.0.1:3000/ 2>&1
                for port in 3001 3002 3003; do curl -s -o /dev/null -w "port$port: %{http_code}\n" --max-time 4 http://127.0.0.1:$port/ 2>&1 | grep -v 000; done
                curl -s --max-time 8 http://127.0.0.1:3000/ | grep -c "мастер-класс" 2>/dev/null || echo "0 упоминаний мастер-класс на главной"
                curl -s -o /dev/null -w "masterclass page: %{http_code}\n" --max-time 8 http://127.0.0.1:3000/education/masterclass
                curl -s --max-time 8 http://127.0.0.1:3000/education | grep -c "20 июня" || echo "0 упоминаний 20 июня на /education"
                echo "=== END ==="
              ' 2>&1
