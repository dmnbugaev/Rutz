# Финальный временный workflow: данные для восстановления домена.
# Удаляется сразу после запуска.
name: Domain restore info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Сбор данных для DNS
        env:
          HOST: ${{ secrets.SSH_HOST }}
          K: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k && chmod 600 ~/.ssh/k
          # сравнение с кандидатами — печатаем только совпадение, не значение
          for ip in 130.49.149.189 5.63.158.22; do
            [ "$HOST" = "$ip" ] && echo "SSH_HOST_MATCH: $ip"
          done
          ssh -p 22222 -i ~/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              "admin@$HOST" '
                echo "=== DOMAIN INFO ==="
                echo "--- rutz nginx vhost ---"
                cat /etc/nginx/sites-enabled/rutz 2>/dev/null || cat /etc/nginx/sites-available/rutz 2>/dev/null
                echo "--- cert dirs ---"
                ls /etc/letsencrypt 2>/dev/null; ls /etc/ssl/certs 2>/dev/null | head -2
                for f in $(grep -hoE "ssl_certificate\s+\S+" /etc/nginx/sites-enabled/* 2>/dev/null | awk "{print \$2}" | sort -u); do ls -l "$f" 2>/dev/null; done
                echo "=== END ==="
              ' 2>&1
