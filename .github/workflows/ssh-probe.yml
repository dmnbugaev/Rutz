# Временный диагностический workflow: осмотр прод-сервера Rutz.
# Удаляется после починки деплоя.
name: Server inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Осмотр сервера
        env:
          HOST: ${{ secrets.SSH_HOST }}
          K: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh -p 22222 -i ~/.ssh/k -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              "admin@$HOST" '
                echo "=== INSPECT on $(hostname) ==="
                echo "--- ip ---"; ip -4 addr show 2>/dev/null | grep inet | grep -v 127.0.0.1
                echo "--- /var/www ---"; ls /var/www 2>&1
                echo "--- rutz dir ---"; ls -ld /var/www/Rutz 2>&1
                cd /var/www/Rutz 2>/dev/null && git log --oneline -1 2>&1 && git status -sb 2>&1 | head -2
                echo "--- pm2 (as $(whoami)) ---"; timeout 10 pm2 ls 2>&1 | head -15
                echo "--- pm2 daemon owners ---"; ls -ld /root/.pm2 /home/*/.pm2 2>/dev/null
                echo "--- node procs ---"; ps aux | grep -E "next-server|node" | grep -v grep | head -6
                echo "--- listening ---"; (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ":80 |:443 |:3000 " | head -6
                echo "--- nginx sites ---"; ls /etc/nginx/sites-enabled 2>/dev/null || ls /etc/nginx/conf.d 2>/dev/null || echo no-nginx-conf
                echo "--- certbot ---"; ls /etc/letsencrypt/live 2>/dev/null || echo no-certbot
                echo "--- disk ---"; df -h / | tail -1
                echo "--- node ---"; node -v 2>&1; npm -v 2>&1
                echo "=== END ==="
              ' 2>&1
