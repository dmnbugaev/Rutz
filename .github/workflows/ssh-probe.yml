# Временный диагностический workflow: проверяет, какой SSH-ключ
# принимается прод-сервером (секрет SSH_HOST). Удаляется после починки.
name: SSH probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Перебор ключей и пользователей
        env:
          HOST: ${{ secrets.SSH_HOST }}
          K1: ${{ secrets.CAND1 }}
          K2: ${{ secrets.CAND2 }}
          K3: ${{ secrets.CAND3 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K1" > ~/.ssh/k1
          printf '%s\n' "$K2" > ~/.ssh/k2
          printf '%s\n' "$K3" > ~/.ssh/k3
          chmod 600 ~/.ssh/k*
          echo "host=$HOST port=22222"
          for u in admin root; do
            for k in k1 k2 k3; do
              echo "=== user=$u key=$k ==="
              ssh -p 22222 -i ~/.ssh/$k -o IdentitiesOnly=yes -o BatchMode=yes \
                  -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
                  "$u@$HOST" 'echo "SUCCESS user=$(whoami) host=$(hostname)"; ls -d /var/www/Rutz 2>/dev/null || echo no-rutz-dir' 2>&1 | tail -2
              sleep 2
            done
          done
          echo "=== probe done ==="
